aid: pantera-capital
name: Pantera Capital
description: >-
  Pantera Capital is a U.S.-based investment firm founded in 2003 by Dan Morehead (former Tiger
  Management head of macro trading and CFO) that pivoted in 2013 to become the first U.S. institutional
  asset manager focused exclusively on blockchain technology and digital assets. Headquartered in the San
  Francisco Bay Area with offices in New York and San Juan, Puerto Rico, the firm launched the first
  cryptocurrency fund in the United States in 2013 and now manages roughly $3.5B-$3.8B across multiple
  fund strategies: a Bitcoin Fund for pure BTC exposure, an Early-Stage Token Fund, a Liquid Token Fund,
  a Blockchain Fund, and a series of Venture Funds for equity investments. Pantera backs token projects,
  exchanges, DeFi and infrastructure teams, wallets, custodians, and ecosystem builders from pre-launch
  token stage through growth-stage equity, writing checks from roughly $500K to $50M+ and having led about
  half of its 200+ investments since 2013. Notable investments include Coinbase, Circle, Ripple, Uniswap,
  Bitstamp, Polkadot, Near, Filecoin, StarkWare, and Ondo Finance.
